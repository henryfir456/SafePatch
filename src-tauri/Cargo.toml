[package]
name = "safepatch"
version = "0.1.0"
edition = "2021"
default-run = "safepatch"

[lib]
name = "safepatch_lib"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
acceptance = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = [], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[[bin]]
name = "safepatch"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "inventory_probe"
path = "src/bin/inventory_probe.rs"

[[bin]]
name = "npm_probe"
path = "src/bin/npm_probe.rs"

[[bin]]
name = "python_probe"
path = "src/bin/python_probe.rs"
