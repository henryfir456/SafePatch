name: Windows Preview
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install declared dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: TypeScript and production renderer
        run: npm run build
      - name: UI regression tests (synthetic IPC fixtures)
        run: npm test
      - name: SQLite schema regression tests
        run: npm run test:schema
      - name: Embedded version consistency and negative contracts
        run: npm run test:version
      - name: PowerShell adapter regression tests
        shell: powershell
        run: ./scripts/test-adapter.ps1
      - name: WinGet update evidence and bounded query regression tests
        shell: powershell
        run: ./scripts/test-winget-updates.ps1
      - name: Reject inherited PowerShell module hijacking
        run: node scripts/test-module-path.mjs
      - name: VS Code read-only metadata regression tests
        shell: powershell
        run: ./scripts/test-vscode.ps1
      - name: Node resource and lifecycle regression tests
        shell: powershell
        run: ./scripts/test-node.ps1
      - name: Parse Preview CI scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/*preview*.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) { throw 'PREVIEW_SCRIPT_PARSE_FAILED' }
          }
          if (git ls-files src/PythonInventory.tsx src-tauri/src/python.rs) { throw 'PREVIEW_UNAPPROVED_SCOPE' }
      - name: Preview failure and Windows PowerShell encoding contracts
        shell: powershell
        run: ./scripts/test-preview-contracts.ps1
      - name: Real Windows Installer table reader preflight (metadata fixture only)
        shell: pwsh
        run: ./scripts/test-preview-msi.ps1
      - name: Build pinned self-contained typed WinGet helper
        shell: pwsh
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
        run: ./scripts/build-winget-helper.ps1
      - name: Rust unit tests and migrations
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - name: Rust static analysis
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Production Windows EXE and MSI bundles
        run: |
          git status --short
          npm run tauri -- build --verbose --no-binary-patching -- --locked
      - name: Verify compiled production packages and stage Preview
        shell: pwsh
        run: ./scripts/prepare-preview-artifact.ps1
      - name: Restricted-token owned installer and application lifecycle
        shell: pwsh
        run: |
          $env:PREVIEW_NODE=(Get-Command node.exe).Source
          ./scripts/run-preview-restricted.ps1 -ScriptPath ./scripts/verify-preview-lifecycle.ps1 -StagePath $env:PREVIEW_STAGE
      - name: Build real inventory integration probe
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --bin inventory_probe
      - name: Build opt-in npm project integration probe
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --bin npm_probe
      - name: Build opt-in real device security integration probe
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --no-default-features --bin security_probe
      - name: Build isolated native acceptance executable
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --target-dir src-tauri/target-acceptance --release --features acceptance --bin safepatch
      - name: Seal production Preview identity and checksums
        shell: pwsh
        run: ./scripts/prepare-preview-artifact.ps1 -Seal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SafePatch-Windows-Preview-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ env.PREVIEW_STAGE }}/*.exe
            ${{ env.PREVIEW_STAGE }}/*.msi
            ${{ env.PREVIEW_STAGE }}/README.md
            ${{ env.PREVIEW_STAGE }}/manifest.json
            ${{ env.PREVIEW_STAGE }}/ci-*.json
            ${{ env.PREVIEW_STAGE }}/SHA256SUMS.txt
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-native-validation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            src-tauri/Cargo.lock
            src-tauri/target-acceptance/release/safepatch.exe
            src-tauri/target/debug/inventory_probe.exe
            src-tauri/target/debug/npm_probe.exe
            src-tauri/target/debug/security_probe.exe
            ${{ env.PREVIEW_STAGE }}/ci-*.json
          retention-days: 7
